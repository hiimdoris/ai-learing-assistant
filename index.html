<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 智慧學習助理 - Smart AI Study Hub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0f172a; color: #f8fafc; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 9999px; }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    .rotate-y-180 { transform: rotateY(180deg); }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card-hover { transition: all 0.2s ease-in-out; }
    .glass-card-hover:hover { border-color: rgba(99, 102, 241, 0.4); box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.15); transform: translateY(-2px); }
  </style>
</head>
<body class="h-screen overflow-hidden flex flex-col bg-slate-950 text-slate-100">

  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_FILES = [
      {
        id: 'file-1',
        name: 'Machine_Learning_Fundamentals.pdf',
        type: 'pdf',
        size: '2.4 MB',
        words: 3420,
        active: true,
        content: `機器學習 (Machine Learning) 基礎導論：\n\n1. 監督式學習 (Supervised Learning)：利用標註資料 (Labeled Data) 訓練模型。常見演算法包含：\n- 線性回歸 (Linear Regression)：預測連續數值。\n- 邏輯回歸 (Logistic Regression)：用於二元分類。\n- 決策樹 (Decision Trees) 與 隨機森林 (Random Forest)：處理非線性邊界。\n- 支援向量機 (Support Vector Machine, SVM)：透過最大化邊界 (Margin) 分離類別。\n\n2. 非監督式學習 (Unsupervised Learning)：處理未標註資料，尋找潛在結構。\n- K-Means 分群：依距離聚合資料點。\n- PCA (Principal Component Analysis)：降維與特徵萃取。`
      },
      {
        id: 'file-2',
        name: 'Economics_Micro_Notes.txt',
        type: 'txt',
        size: '850 KB',
        words: 1850,
        active: true,
        content: `個體經濟學 (Microeconomics) 核心筆記：\n\n1. 供需法則 (Law of Demand and Supply):\n- 需求法則：價格上升，需求量下降。\n- 供給法則：價格上升，供給量上升。\n\n2. 彈性 (Elasticity):\n- 需求價格彈性 (PED > 1 代表富有彈性)。`
      }
    ];

    const STUDY_MODES = [
      { id: 'quiz', title: '測驗與考題生成', subtitle: '單選題與實戰演練', icon: 'help-circle', badge: '測驗模式', color: 'from-indigo-500 to-purple-600', bgColor: 'bg-indigo-500/10 border-indigo-500/30 text-indigo-400' },
      { id: 'summary', title: '重點整理與摘要', subtitle: 'TL;DR與核心概念', icon: 'file-text', badge: '摘要模式', color: 'from-blue-500 to-cyan-600', bgColor: 'bg-blue-500/10 border-blue-500/30 text-blue-400' },
      { id: 'flashcards', title: '智慧字卡 / 翻轉卡片', subtitle: '記憶卡片與進度追蹤', icon: 'layers', badge: '記憶模式', color: 'from-emerald-500 to-teal-600', bgColor: 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' },
      { id: 'explainer', title: '深度觀念講解 (費曼學習)', subtitle: '白話解說與即時問答', icon: 'lightbulb', badge: '費曼觀念', color: 'from-amber-500 to-orange-600', bgColor: 'bg-amber-500/10 border-amber-500/30 text-amber-400' },
      { id: 'outline', title: '心智圖構架與大綱', subtitle: '階層式知識大綱', icon: 'git-fork', badge: '架構圖譜', color: 'from-rose-500 to-pink-600', bgColor: 'bg-rose-500/10 border-rose-500/30 text-rose-400' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('workspace');
      const [files, setFiles] = useState(DEFAULT_FILES);
      const [selectedMode, setSelectedMode] = useState('quiz');
      const [customPrompt, setCustomPrompt] = useState('專有名詞保留英文，幫我製作適合考前複習的內容。');
      const [isLoading, setIsLoading] = useState(false);
      const [generatedResult, setGeneratedResult] = useState(null);

      useEffect(() => {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          try { window.lucide.createIcons(); } catch (e) {}
        }
      }, [activeTab, selectedMode, generatedResult]);

      const handleGenerate = () => {
        setIsLoading(true);
        setTimeout(() => {
          if (selectedMode === 'quiz') {
            setGeneratedResult({
              mode: 'quiz',
              title: '【AI 生成】重點測驗題目',
              questions: [
                { id: 1, question: '在 Supervised Learning 中，常用於連續性數值預測的演算法為？', options: ['Logistic Regression', 'Linear Regression', 'K-Means', 'SVM'], answer: 1, explanation: 'Linear Regression 用於擬合連續數值。' },
                { id: 2, question: '模型在 Training Data 上表現極佳，但在 Test Data 上誤差很大，稱為？', options: ['Underfitting', 'Overfitting', 'High Bias', 'Zero Gradient'], answer: 1, explanation: 'Overfitting 表示過度擬合訓練集。' }
              ]
            });
          } else {
            setGeneratedResult({
              mode: 'summary',
              title: '【AI 生成】重點摘要',
              tldr: '本文件涵蓋機器學習與個體經濟學基礎概念。',
              keyPoints: [{ concept: 'Supervised Learning', detail: '利用標籤資料訓練模型。' }]
            });
          }
          setIsLoading(false);
        }, 600);
      };

      return (
        <div className="flex h-screen w-full bg-slate-950 text-slate-100">
          <aside className="w-64 bg-slate-900 border-r border-slate-800 p-4 shrink-0 flex flex-col justify-between">
            <div>
              <div className="font-bold text-lg mb-6 text-indigo-400">🧠 AI 學習助理</div>
              <nav className="space-y-2">
                <button onClick={() => setActiveTab('workspace')} className={`w-full p-2.5 rounded-xl text-left text-sm ${activeTab==='workspace'?'bg-indigo-600 text-white':'text-slate-400'}`}>工作台 Workspace</button>
                <button onClick={() => setActiveTab('library')} className={`w-full p-2.5 rounded-xl text-left text-sm ${activeTab==='library'?'bg-indigo-600 text-white':'text-slate-400'}`}>我的文庫 ({files.length})</button>
              </nav>
            </div>
          </aside>
          <main className="flex-1 p-6 overflow-y-auto">
            <div className="flex justify-between items-center mb-6">
              <h1 className="text-xl font-bold">AI 智慧學習助理 Dashboard</h1>
              <button onClick={handleGenerate} className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm">立即生成學習內容</button>
            </div>
            {isLoading ? (
              <div className="text-center py-20 text-indigo-400">AI 正在深度解析與生成中...</div>
            ) : generatedResult ? (
              <div className="space-y-4 max-w-3xl mx-auto">
                <div className="p-4 bg-slate-900 rounded-xl border border-slate-800">
                  <h2 className="text-lg font-bold text-indigo-300 mb-2">{generatedResult.title}</h2>
                  {generatedResult.mode === 'quiz' && generatedResult.questions.map((q, idx) => (
                    <div key={q.id} className="mt-3 p-3 bg-slate-950 rounded-lg">
                      <p className="font-semibold text-sm">Q{idx+1}. {q.question}</p>
                      <div className="grid grid-cols-2 gap-2 mt-2">
                        {q.options.map((opt, oIdx) => (
                          <div key={oIdx} className="p-2 border border-slate-800 rounded text-xs hover:border-indigo-500 cursor-pointer">{opt}</div>
                        ))}
                      </div>
                    </div>
                  ))}
                  {generatedResult.mode === 'summary' && (
                    <p className="text-sm text-slate-300">{generatedResult.tldr}</p>
                  )}
                </div>
              </div>
            ) : (
              <div className="text-center py-20 text-slate-500">點選右上角「立即生成學習內容」開始體驗！</div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
