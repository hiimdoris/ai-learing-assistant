<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI Study Hub - 智慧學習助理</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React-DOM -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; background-color: #090d16; color: #f8fafc; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; transition: transform 0.5s; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .backface-hidden { backface-visibility: hidden; }
  </style>
</head>
<body class="h-screen overflow-hidden flex flex-col bg-slate-950 text-slate-100">

  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState } = React;

    const INITIAL_FILES = [
      { id: 'file-1', name: 'Machine_Learning_Fundamentals.pdf', words: 3420, active: true, type: 'pdf', content: '機器學習 (Machine Learning) 導論：\n1. 監督式學習 (Supervised Learning)：預測連續數值的 Linear Regression、用於二元分類的 Logistic Regression。\n2. 非監督式學習 (Unsupervised Learning)：K-Means 分群、PCA 降維。' },
      { id: 'file-2', name: 'Economics_Micro_Notes.txt', words: 1850, active: true, type: 'txt', content: '個體經濟学筆記：\n1. 供需法則 (Demand and Supply)\n2. 需求價格彈性 (PED)' }
    ];

    const STUDY_MODES = [
      { id: 'quiz', title: '測驗與考題生成', subtitle: '選擇題與實戰演練', icon: '📝' },
      { id: 'summary', title: '重點整理與摘要', subtitle: 'TL;DR 與核心概念提鍊', icon: '⚡' },
      { id: 'flashcards', title: '智慧記憶卡片', subtitle: '雙面翻轉記憶卡', icon: '🎴' },
      { id: 'explainer', title: '費曼學習法白話講解', subtitle: '通俗比喻與即時對話', icon: '💡' }
    ];

    function App() {
      const [currentView, setCurrentView] = useState('dashboard'); // 'dashboard', 'workspace', 'library'
      const [files, setFiles] = useState(INITIAL_FILES);
      const [selectedMode, setSelectedMode] = useState('quiz');
      const [customPrompt, setCustomPrompt] = useState('專有名詞保留英文對照，幫我製作適合考前複習的內容。');
      const [isLoading, setIsLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [cardFlipped, setCardFlipped] = useState(false);
      
      // 上傳 modal
      const [showUploadModal, setShowUploadModal] = useState(false);
      const [pasteText, setPasteText] = useState('');
      const [pasteTitle, setPasteTitle] = useState('');

      const handleAddNote = () => {
        if (!pasteText.trim()) return;
        const newFile = {
          id: 'file-' + Date.now(),
          name: pasteTitle.trim() ? `${pasteTitle}.txt` : `筆記_${new Date().toLocaleTimeString().slice(0,5)}.txt`,
          words: pasteText.length,
          active: true,
          type: 'txt',
          content: pasteText
        };
        setFiles([newFile, ...files]);
        setPasteText('');
        setPasteTitle('');
        setShowUploadModal(false);
      };

      const handleGenerate = () => {
        setIsLoading(true);
        setCurrentView('workspace');
        setTimeout(() => {
          if (selectedMode === 'quiz') {
            setResult({
              type: 'quiz',
              title: '【AI 生成】核心考題模擬',
              items: [
                { q: '在 Supervised Learning 中，用於預測「連續性數值」的演算法為？', options: ['Linear Regression', 'Logistic Regression', 'K-Means', 'SVM'], ans: 0 },
                { q: '當模型在 Training Data 表現極佳，但在 Test Data 誤差極大時稱為？', options: ['Underfitting', 'Overfitting', 'High Bias', 'Zero Gradient'], ans: 1 }
              ]
            });
          } else if (selectedMode === 'summary') {
            setResult({
              type: 'summary',
              title: '【AI 生成】重點觀念摘要 (TL;DR)',
              content: '1. 機器學習分成監督式（含有標籤）與非監督式（無標籤分群）。\n2. 供需法則中，價格上升會引發需求量下降，均衡點由需求與供給曲線交點決定。'
            });
          } else if (selectedMode === 'flashcards') {
            setResult({
              type: 'flashcards',
              title: '【AI 生成】智慧記憶字卡',
              front: 'Supervised Learning',
              back: '監督式學習：利用標註資料 (Labeled Data) 訓練模型，學習由 X 到 Y 的映射關係。'
            });
          } else {
            setResult({
              type: 'explainer',
              title: '【AI 導師】費曼白話解說',
              content: '【用教小狗來比喻機器學習】：\n監督式學習就像是你丟球給小狗，並告訴牠「這是球」（給予標籤）；非監督式學習則是把一整桶玩具放在地上，讓小狗自己把形狀一樣的堆在一起（自主分群）。'
            });
          }
          setIsLoading(false);
        }, 700);
      };

      return (
        <div className="flex h-screen w-full bg-slate-950 text-slate-100">
          
          {/* 左側邊欄 (SIDEBAR) */}
          <aside className="w-64 bg-slate-900 border-r border-slate-800 p-4 flex flex-col justify-between shrink-0 select-none">
            <div className="space-y-6">
              
              {/* Logo / 品牌 */}
              <div 
                onClick={() => setCurrentView('dashboard')}
                className="flex items-center gap-3 p-2 rounded-xl cursor-pointer hover:bg-slate-800/60 transition-colors"
              >
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-500/30">
                  🧠
                </div>
                <div>
                  <h1 className="font-bold text-sm bg-gradient-to-r from-white to-indigo-200 bg-clip-text text-transparent">
                    Smart Study Hub
                  </h1>
                  <p className="text-[10px] text-indigo-400 font-mono">AI 智慧學習助理</p>
                </div>
              </div>

              {/* 匯入快捷鍵 */}
              <button
                onClick={() => setShowUploadModal(true)}
                className="w-full py-2.5 px-3 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 font-bold text-xs shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 transition-all cursor-pointer"
              >
                <span>➕ 匯入檔案 / 貼上筆記</span>
              </button>

              {/* 主選單 */}
              <nav className="space-y-1">
                <button
                  onClick={() => setCurrentView('dashboard')}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                    currentView === 'dashboard' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800/60'
                  }`}
                >
                  <span>🏠</span>
                  <span>首頁總覽 (Dashboard)</span>
                </button>

                <button
                  onClick={() => setCurrentView('workspace')}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                    currentView === 'workspace' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800/60'
                  }`}
                >
                  <span>✨</span>
                  <span>AI 學習工作台</span>
                </button>

                <button
                  onClick={() => setCurrentView('library')}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                    currentView === 'library' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800/60'
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <span>📁</span>
                    <span>我的文庫資料夾</span>
                  </div>
                  <span className="px-2 py-0.5 rounded-full text-[10px] bg-slate-800 text-indigo-300 font-mono">
                    {files.length}
                  </span>
                </button>
              </nav>

              {/* 近期學習紀錄 */}
              <div className="pt-2">
                <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider px-2">近期學習紀錄</span>
                <div className="space-y-1 mt-2 text-xs text-slate-400">
                  <div className="p-2 rounded-lg hover:bg-slate-800/50 cursor-pointer truncate">📝 機器學習模擬測驗</div>
                  <div className="p-2 rounded-lg hover:bg-slate-800/50 cursor-pointer truncate">⚡ 個體經濟學重點摘要</div>
                </div>
              </div>

            </div>

            {/* 容量使用顯示 */}
            <div className="p-3 rounded-xl bg-slate-950/60 border border-slate-800 text-[11px] space-y-1">
              <div className="flex justify-between text-slate-400">
                <span>AI 上下文容量</span>
                <span className="text-indigo-400 font-mono">12.8k / 128k</span>
              </div>
              <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                <div className="w-[10%] h-full bg-indigo-500"></div>
              </div>
            </div>
          </aside>

          {/* 右側主內容區 */}
          <main className="flex-1 flex flex-col overflow-hidden">
            
            {/* 頂部 Header */}
            <header className="h-14 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/40">
              <div className="flex items-center gap-2 text-xs font-bold text-slate-200">
                <span>Smart Study Hub</span>
                <span className="text-slate-600">/</span>
                <span className="text-indigo-400">
                  {currentView === 'dashboard' && '首頁總覽'}
                  {currentView === 'workspace' && 'AI 學習工作台'}
                  {currentView === 'library' && '個人文庫庫房'}
                </span>
              </div>

              {currentView === 'workspace' && (
                <button
                  onClick={handleGenerate}
                  disabled={isLoading}
                  className="px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold text-xs shadow-lg shadow-indigo-500/20 flex items-center gap-2 cursor-pointer transition-all"
                >
                  <span>{isLoading ? '⏳ 生成中...' : '🪄 生成學習內容'}</span>
                </button>
              )}
            </header>

            {/* 1. 首頁總覽 VIEW */}
            {currentView === 'dashboard' && (
              <div className="flex-1 overflow-y-auto p-8 space-y-8 max-w-5xl mx-auto w-full">
                <div className="rounded-3xl p-8 bg-gradient-to-r from-indigo-900/50 to-purple-900/30 border border-indigo-500/30 space-y-4">
                  <h2 className="text-2xl font-extrabold text-white">歡迎使用 Smart AI Study Hub 👋</h2>
                  <p className="text-xs text-slate-300 max-w-xl leading-relaxed">
                    上傳您的課堂講義、PDF 或個人筆記，讓 AI 自動為您出考題、製作重點摘要與 3D 記憶字卡！
                  </p>
                  <div className="flex gap-3 pt-2">
                    <button
                      onClick={() => setCurrentView('workspace')}
                      className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-lg shadow-indigo-600/30 transition-all cursor-pointer"
                    >
                      開啟 AI 工作台
                    </button>
                    <button
                      onClick={() => setShowUploadModal(true)}
                      className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs border border-slate-700 transition-all cursor-pointer"
                    >
                      匯入新筆記
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="glass-card p-5 rounded-2xl border border-slate-800 space-y-2">
                    <span className="text-xs text-slate-400">已匯入講義數量</span>
                    <div className="text-2xl font-bold font-mono text-indigo-400">{files.length} 份文件</div>
                  </div>
                  <div className="glass-card p-5 rounded-2xl border border-slate-800 space-y-2">
                    <span className="text-xs text-slate-400">累積演練考題</span>
                    <div className="text-2xl font-bold font-mono text-purple-400">18 題</div>
                  </div>
                  <div className="glass-card p-5 rounded-2xl border border-slate-800 space-y-2">
                    <span className="text-xs text-slate-400">智慧字卡庫</span>
                    <div className="text-2xl font-bold font-mono text-emerald-400">24 張</div>
                  </div>
                </div>
              </div>
            )}

            {/* 2. 工作台 VIEW */}
            {currentView === 'workspace' && (
              <div className="flex-1 overflow-hidden flex flex-col lg:flex-row">
                
                {/* 左側設定區 */}
                <div className="w-full lg:w-80 border-r border-slate-800 p-4 space-y-4 overflow-y-auto bg-slate-900/20">
                  
                  {/* 1. 檔案勾選 */}
                  <div className="glass-card p-4 rounded-2xl space-y-3 border border-slate-800">
                    <div className="text-xs font-bold text-slate-200">1. 選擇參與分析檔案</div>
                    <div className="space-y-2">
                      {files.map(f => (
                        <label key={f.id} className="flex items-center justify-between p-2 rounded-xl bg-slate-950/60 border border-slate-800 text-xs cursor-pointer hover:border-indigo-500/50">
                          <div className="flex items-center gap-2 truncate">
                            <input
                              type="checkbox"
                              checked={f.active}
                              onChange={() => setFiles(files.map(x => x.id === f.id ? {...x, active: !x.active} : x))}
                              className="accent-indigo-600"
                            />
                            <span className="truncate">{f.name}</span>
                          </div>
                          <span className="text-[10px] text-slate-500 font-mono">{f.words}字</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* 2. 學習模式 */}
                  <div className="glass-card p-4 rounded-2xl space-y-3 border border-slate-800">
                    <div className="text-xs font-bold text-slate-200">2. 選擇學習模式</div>
                    <div className="space-y-2">
                      {STUDY_MODES.map(m => (
                        <div
                          key={m.id}
                          onClick={() => setSelectedMode(m.id)}
                          className={`p-3 rounded-xl border text-xs cursor-pointer transition-all ${
                            selectedMode === m.id ? 'border-indigo-500 bg-indigo-950/50 text-white' : 'border-slate-800 bg-slate-950/40 text-slate-400'
                          }`}
                        >
                          <div className="font-bold flex items-center gap-2">
                            <span>{m.icon}</span>
                            <span>{m.title}</span>
                          </div>
                          <div className="text-[10px] text-slate-400 mt-1">{m.subtitle}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* 3. Prompt */}
                  <div className="glass-card p-4 rounded-2xl space-y-3 border border-slate-800">
                    <div className="text-xs font-bold text-slate-200">3. 自訂指令 Prompt</div>
                    <textarea
                      value={customPrompt}
                      onChange={e => setCustomPrompt(e.target.value)}
                      rows="3"
                      className="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                    ></textarea>
                  </div>

                </div>

                {/* 右側結果展現區 */}
                <div className="flex-1 p-6 overflow-y-auto bg-slate-950">
                  {isLoading && (
                    <div className="text-center py-20 space-y-3">
                      <div className="text-2xl animate-spin">🌀</div>
                      <div className="text-xs text-indigo-400 font-semibold">AI 正在深度分析文件與生成內容...</div>
                    </div>
                  )}

                  {!isLoading && !result && (
                    <div className="text-center py-24 text-slate-500 space-y-2">
                      <div className="text-3xl opacity-50">✨</div>
                      <div className="text-xs">請點擊右上角「生成學習內容」按鈕開始！</div>
                    </div>
                  )}

                  {!isLoading && result && (
                    <div className="max-w-2xl mx-auto space-y-4">
                      <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-4">
                        <h3 className="font-bold text-sm text-indigo-300">{result.title}</h3>

                        {/* QUIZ */}
                        {result.type === 'quiz' && (
                          <div className="space-y-4">
                            {result.items.map((item, idx) => (
                              <div key={idx} className="p-4 bg-slate-950 rounded-xl space-y-3 border border-slate-800">
                                <div className="text-xs font-bold">Q{idx+1}. {item.q}</div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                  {item.options.map((opt, oIdx) => (
                                    <button key={oIdx} className="p-2.5 border border-slate-800 rounded-xl text-xs text-left hover:border-indigo-500 hover:bg-indigo-950/30 transition-all">
                                      {opt}
                                    </button>
                                  ))}
                                </div>
                              </div>
                            ))}
                          </div>
                        )}

                        {/* SUMMARY / EXPLAINER */}
                        {(result.type === 'summary' || result.type === 'explainer') && (
                          <div className="p-4 bg-slate-950 rounded-xl text-xs leading-relaxed text-slate-300 whitespace-pre-line border border-slate-800">
                            {result.content}
                          </div>
                        )}

                        {/* FLASHCARDS */}
                        {result.type === 'flashcards' && (
                          <div className="perspective-1000 w-full h-48 cursor-pointer" onClick={() => setCardFlipped(!cardFlipped)}>
                            <div className={`relative w-full h-full transform-style-3d ${cardFlipped ? 'rotate-y-180' : ''}`}>
                              <div className="absolute inset-0 glass-card rounded-2xl p-6 flex flex-col justify-between items-center backface-hidden border border-indigo-500/30">
                                <span className="text-[10px] text-indigo-400 font-mono">卡片正面</span>
                                <h4 className="font-bold text-base text-white">{result.front}</h4>
                                <span className="text-[10px] text-slate-500">點擊翻轉查看答案</span>
                              </div>
                              <div className="absolute inset-0 glass-card rounded-2xl p-6 flex flex-col justify-between items-center backface-hidden rotate-y-180 border border-emerald-500/30">
                                <span className="text-[10px] text-emerald-400 font-mono">觀念解析</span>
                                <p className="text-xs text-slate-200 text-center">{result.back}</p>
                                <span className="text-[10px] text-slate-500">點擊翻轉</span>
                              </div>
                            </div>
                          </div>
                        )}

                      </div>
                    </div>
                  )}
                </div>

              </div>
            )}

            {/* 3. 我的文庫 VIEW */}
            {currentView === 'library' && (
              <div className="flex-1 overflow-y-auto p-8 max-w-4xl mx-auto w-full space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-sm font-bold text-slate-200">我的文庫檔案 ({files.length})</h2>
                  <button onClick={() => setShowUploadModal(true)} className="px-3 py-1.5 rounded-lg bg-indigo-600 text-xs font-bold">➕ 新增筆記</button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {files.map(f => (
                    <div key={f.id} className="glass-card p-4 rounded-2xl border border-slate-800 space-y-2">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-xs truncate">{f.name}</span>
                        <button onClick={() => setFiles(files.filter(x => x.id !== f.id))} className="text-rose-400 text-xs">刪除</button>
                      </div>
                      <p className="text-[11px] text-slate-400 line-clamp-3 bg-slate-950/60 p-2 rounded-lg font-mono">{f.content}</p>
                      <div className="text-[10px] text-slate-500 pt-1">{f.words} 字</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* 上傳 Modal */}
          {showUploadModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-card w-full max-w-md p-6 rounded-3xl border border-slate-800 space-y-4">
                <h3 className="font-bold text-sm text-slate-200">新增文字筆記到文庫</h3>
                <input
                  type="text"
                  placeholder="標題 (選填)..."
                  value={pasteTitle}
                  onChange={e => setPasteTitle(e.target.value)}
                  className="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none"
                />
                <textarea
                  rows="5"
                  placeholder="在此貼上課堂講義或筆記內容..."
                  value={pasteText}
                  onChange={e => setPasteText(e.target.value)}
                  className="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none"
                ></textarea>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setShowUploadModal(false)} className="px-3 py-1.5 text-xs text-slate-400">取消</button>
                  <button onClick={handleAddNote} className="px-4 py-1.5 bg-indigo-600 rounded-xl text-xs font-bold text-white">加入文庫</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html></html>
